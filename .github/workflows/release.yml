name: Release

# Two steps, two gates.
#
# 1. release-please keeps a release PR open: the version bump and the
#    CHANGELOG.md entries computed from the Conventional Commits merged since
#    the last tag. Merging that PR tags the commit and creates the GitHub
#    Release. (The PR is opened with GITHUB_TOKEN, and GitHub does not run
#    workflows for those: close and reopen it once to start CI on it.)
# 2. The tagged commit is packed into a tarball, checked, and the tarball is
#    STAGED on npm. Staging authenticates by OIDC — npm trusts this workflow
#    file in this repository in the `npm` environment, so there is no npm
#    token anywhere — and the trusted publisher is allowed `npm stage
#    publish` only. Nothing goes live until a maintainer approves the staged
#    tarball on npmjs.com (or with `npm stage approve`) with their second
#    factor.
#
# Step 2 is three jobs, so that the toolchain runs neither where the tarball
# is made nor where the credential is:
#
#   build   packs the tarball. It installs without install scripts and runs
#           only the TypeScript compiler, which has no dependencies: no other
#           package's code runs where what is published is made.
#   check   runs everything else on the same commit: typecheck, tests, lint,
#           the package check. A compromised dependency of that toolchain
#           runs here, with neither the tarball nor a credential in reach.
#   stage   holds the OIDC identity. It checks nothing out and installs only
#           npm; it publishes the tarball build made, once check has passed.
#
# The file name and the environment name are part of the trusted publisher's
# identity on npmjs.com: renaming either breaks publishing (as an E404).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    name: build the tarball
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # What is built here is what is published: no dependency cache,
          # which a run elsewhere could have poisoned.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      # The build just ran; `prepack` would only run it again.
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: '*.tgz'
          if-no-files-found: error

  check:
    name: check the tagged commit
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm check:package

  stage:
    name: stage on npm
    needs: [release-please, build, check]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # OIDC: the whole of the npm credential
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Staged publishing needs npm 11.15.0 or later. Pinned, not a range: npm
      # is the one package whose code runs next to the credential.
      - run: npm install --global npm@11.20.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
      - run: npm stage publish ./*.tgz
